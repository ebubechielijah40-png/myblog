{% extends 'blog/base.html' %} {% block content %}
<div class="mb-8">
  <h1 class="text-3xl font-bold tracking-tight text-slate-900">All Posts</h1>
  <p class="mt-2 text-slate-600">Browse the latest blog entries.</p>
</div>

<div class="space-y-6 grid md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-6">
  {% for post in posts %}
  <article
    class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:shadow-md"
  >
    <h2 class="text-2xl font-semibold text-slate-900">
      <a
        href="{% url 'blog:post_detail' post.slug %}"
        class="hover:text-sky-600"
        >{{ post.title }}</a
      >
    </h2>
    <p class="mt-3 text-sm text-slate-500">
      By {{ post.author }} on {{ post.created|date:"M d, Y" }}
    </p>
  </article>
  {% empty %}
  <div
    class="rounded-3xl border border-slate-200 bg-white p-6 text-slate-600 shadow-sm"
  >
    <p>No posts yet.</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
