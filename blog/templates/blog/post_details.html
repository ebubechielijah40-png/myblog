{% extends 'blog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article class="rounded-3xl border border-slate-200 bg-red-100 p-8 shadow-sm">
    <header class="mb-6">
        <h1 class="text-4xl font-bold tracking-tight text-slate-900">{{ post.title }}</h1>
        <p class="mt-3 text-sm text-slate-500">By {{ post.author }} · {{ post.created|date:"F j, Y" }}</p>
    </header>

    <div class="prose prose-slate max-w-none">{{ post.content|linebreaks }}</div>
</article>

<p class="mt-8">
    <a href="{% url 'blog:post_list' %}" class="inline-flex rounded-full bg-sky-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-sky-700">Back to all posts</a>
</p>
{% endblock %}
